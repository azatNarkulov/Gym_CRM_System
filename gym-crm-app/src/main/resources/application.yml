spring:
  application:
    name: gym-crm

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 30m

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

trainer:
  workload:
    base-url: ${TRAINER_WORKLOAD_BASE_URL:http://localhost:8081}
    connect-timeout: ${TRAINER_WORKLOAD_CONNECT_TIMEOUT:1s}
    read-timeout: ${TRAINER_WORKLOAD_READ_TIMEOUT:2s}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
