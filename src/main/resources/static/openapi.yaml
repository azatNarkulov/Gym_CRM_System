openapi: 3.0.3

info:
  title: Gym CRM
  version: 1.0.0
  description: REST API для GYM CRM

servers:
  - url: http://localhost:8080
    description: Локальный сервер

tags:
  - name: Login
  - name: Trainees
  - name: Trainers
  - name: Trainings
  - name: Training types

security:
  - basicAuth: []

paths:
  /api/trainees/register:
    post:
      tags: [Trainees]
      summary: Зарегистрировать trainee
      description: Регистрация не требует аутентификации.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraineeRegistrationRequest"
      responses:
        "200":
          description: Trainee зарегистрирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/trainers/register:
    post:
      tags: [Trainers]
      summary: Зарегистрировать trainer
      description: Регистрация не требует аутентификации.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainerRegistrationRequest"
      responses:
        "200":
          description: Trainer зарегистрирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/login:
    get:
      tags: [Login]
      summary: Проверить учётные данные
      description: Передайте username и password через Basic Auth.
      responses:
        "200":
          description: Аутентификация прошла успешно
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags: [Login]
      summary: Изменить пароль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeLoginRequest"
      responses:
        "200":
          description: Пароль изменён
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trainees/{username}:
    parameters:
      - $ref: "#/components/parameters/Username"

    get:
      tags: [Trainees]
      summary: Получить профиль trainee
      responses:
        "200":
          description: Профиль trainee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraineeProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Trainees]
      summary: Обновить профиль trainee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTraineeProfileRequest"
      responses:
        "200":
          description: Обновлённый профиль trainee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraineeProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Trainees]
      summary: Удалить профиль trainee
      responses:
        "200":
          description: Профиль удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/trainees/{username}/trainers/not-assigned:
    get:
      tags: [Trainees]
      summary: Получить список не назначенных trainer
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: Список trainer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotAssignedTrainer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/trainees/{username}/trainers:
    put:
      tags: [Trainees]
      summary: Обновить список trainer у trainee
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTraineeTrainersRequest"
      responses:
        "200":
          description: Обновлённый список trainer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainerSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trainees/{username}/trainings:
    get:
      tags: [Trainees]
      summary: Получить список тренировок trainee
      parameters:
        - $ref: "#/components/parameters/Username"
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Начальная дата периода включительно.
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Конечная дата периода включительно.
        - name: trainerName
          in: query
          required: false
          schema:
            type: string
        - name: trainingType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TrainingTypeName"
      responses:
        "200":
          description: Список тренировок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TraineeTraining"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/trainees/{username}/activate:
    patch:
      tags: [Trainees]
      summary: Активировать или деактивировать trainee
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationRequest"
      responses:
        "200":
          description: Статус изменён
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trainers/{username}:
    parameters:
      - $ref: "#/components/parameters/Username"

    get:
      tags: [Trainers]
      summary: Получить профиль trainer
      responses:
        "200":
          description: Профиль trainer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainerProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Trainers]
      summary: Обновить профиль trainer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTrainerProfileRequest"
      responses:
        "200":
          description: Обновлённый профиль trainer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainerProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trainers/{username}/trainings:
    get:
      tags: [Trainers]
      summary: Получить список тренировок trainer
      parameters:
        - $ref: "#/components/parameters/Username"
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: traineeName
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Список тренировок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainerTraining"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/trainers/{username}/activate:
    patch:
      tags: [Trainers]
      summary: Активировать или деактивировать trainer
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationRequest"
      responses:
        "200":
          description: Статус изменён
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trainings:
    post:
      tags: [Trainings]
      summary: Добавить тренировку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTrainingRequest"
      responses:
        "200":
          description: Тренировка добавлена
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/training-types:
    get:
      tags: [Training types]
      summary: Получить все типы тренировок
      responses:
        "200":
          description: Список типов тренировок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingType"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Некорректный запрос или ошибка валидации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Unauthorized:
      description: Отсутствует или неверная Basic Auth аутентификация
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthenticationError"

    Forbidden:
      description: Нет доступа к данным другого пользователя
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: Пользователь не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    ServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    TraineeRegistrationRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true

    TrainerRegistrationRequest:
      type: object
      required: [firstName, lastName, specialization]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        specialization:
          $ref: "#/components/schemas/TrainingTypeName"

    RegistrationResponse:
      type: object
      properties:
        username:
          type: string
        password:
          type: string

    ChangeLoginRequest:
      type: object
      required: [username, oldPassword, newPassword]
      properties:
        username:
          type: string
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password

    UpdateTraineeProfileRequest:
      type: object
      required: [firstName, lastName, isActive]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        isActive:
          type: boolean

    UpdateTrainerProfileRequest:
      type: object
      required: [firstName, lastName, isActive]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        specialization:
          type: string
          readOnly: true
          nullable: true
        isActive:
          type: boolean

    ActivationRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    UpdateTraineeTrainersRequest:
      type: object
      required: [trainers]
      properties:
        trainers:
          type: array
          items:
            $ref: "#/components/schemas/TrainerUsernameRequest"

    TrainerUsernameRequest:
      type: object
      required: [trainerUsername]
      properties:
        trainerUsername:
          type: string

    AddTrainingRequest:
      type: object
      required:
        - traineeUsername
        - trainerUsername
        - trainingName
        - trainingDate
        - trainingDuration
        - trainingType
      properties:
        traineeUsername:
          type: string
        trainerUsername:
          type: string
        trainingName:
          type: string
        trainingDate:
          type: string
          format: date
        trainingDuration:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Продолжительность в секундах.
          example: 3600
        trainingType:
          $ref: "#/components/schemas/TrainingTypeName"

    TraineeProfile:
      type: object
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        isActive:
          type: boolean
        trainers:
          type: array
          items:
            $ref: "#/components/schemas/TrainerSummary"

    TrainerProfile:
      type: object
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        specialization:
          $ref: "#/components/schemas/TrainingType"
        isActive:
          type: boolean
        trainees:
          type: array
          items:
            $ref: "#/components/schemas/TraineeSummary"

    TrainerSummary:
      type: object
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        specialization:
          $ref: "#/components/schemas/TrainingType"

    TraineeSummary:
      type: object
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string

    NotAssignedTrainer:
      type: object
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        specialization:
          $ref: "#/components/schemas/TrainingType"

    TraineeTraining:
      type: object
      properties:
        trainingName:
          type: string
        trainingDate:
          type: string
          format: date
        trainingType:
          $ref: "#/components/schemas/TrainingType"
        trainingDuration:
          type: number
          format: double
          description: Продолжительность в секундах.
        trainerName:
          type: string

    TrainerTraining:
      type: object
      properties:
        trainingName:
          type: string
        trainingDate:
          type: string
          format: date
        trainingType:
          $ref: "#/components/schemas/TrainingType"
        trainingDuration:
          type: number
          format: double
          description: Продолжительность в секундах.
        traineeName:
          type: string

    TrainingType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          $ref: "#/components/schemas/TrainingTypeName"

    TrainingTypeName:
      type: string
      enum:
        - FITNESS
        - YOGA
        - ZUMBA
        - STRETCHING
        - RESISTANCE

    ApiError:
      type: object
      properties:
        message:
          type: string

    AuthenticationError:
      type: object
      properties:
        message:
          type: string
        path:
          type: string
        transactionId:
          type: string
          nullable: true
